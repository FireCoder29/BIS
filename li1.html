<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#25343b">
    <title>Coming Soon | Benchmark International School</title>
    <link rel="stylesheet" href="site-enhancements.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #f8fafb;
            color: #25343b;
            font-family: "DM Sans", Arial, sans-serif
        }

        .coming {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center
        }

        .coming-card {
            max-width: 650px;
            background: #fff;
            border: 1px solid #dfe7ea;
            border-radius: 22px;
            padding: clamp(28px, 6vw, 56px);
            box-shadow: 0 18px 45px #22373f12
        }

        .coming img {
            width: 100px;
            height: 100px;
            object-fit: contain
        }

        .coming h1 {
            font: 800 clamp(2rem, 5vw, 3.2rem) Manrope, Arial;
            margin: 20px 0 12px
        }

        .coming p {
            color: #64737a
        }

        .coming a {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 18px;
            border-radius: 9px;
            background: #2e6f7b;
            color: #fff;
            text-decoration: none;
            font-weight: 800
        }
    </style>
</head>

<body>
    <main class="coming">
        <div class="coming-card"><img src="images/lol-removebg-preview-removebg-preview.png" alt="Benchmark International School logo">
            <h1>Something new is coming.</h1>
            <p>This section is currently under development. Please visit the homepage for school information and
                updates.</p><a href="index.html">Return to homepage</a>
        </div>
    </main>
</body>

</html>
